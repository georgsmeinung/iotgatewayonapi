<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Cyan to Violet Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Signal Glow Accent -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Subtle Ambient Glow in center -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)" />

  <!-- Circuit Trace Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top & Left Traces -->
    <path d="M 110 180 L 160 180 L 195 215" />
    <path d="M 180 110 L 180 160 L 215 195" />
    <!-- Bottom & Right Traces -->
    <path d="M 402 332 L 352 332 L 317 297" />
    <path d="M 332 402 L 332 352 L 297 317" />
  </g>

  <!-- Circuit Nodes -->
  <g>
    <circle cx="110" cy="180" r="12" fill="#38bdf8" />
    <circle cx="180" cy="110" r="12" fill="#38bdf8" />
    <circle cx="402" cy="332" r="12" fill="#c084fc" />
    <circle cx="332" cy="402" r="12" fill="#c084fc" />
  </g>

  <!-- Chip Connector Pins -->
  <g fill="url(#brandGrad)">
    <!-- Top Pins -->
    <rect x="202" y="142" width="18" height="26" rx="6" />
    <rect x="247" y="142" width="18" height="26" rx="6" />
    <rect x="292" y="142" width="18" height="26" rx="6" />
    <!-- Bottom Pins -->
    <rect x="202" y="344" width="18" height="26" rx="6" />
    <rect x="247" y="344" width="18" height="26" rx="6" />
    <rect x="292" y="344" width="18" height="26" rx="6" />
    <!-- Left Pins -->
    <rect x="132" y="202" width="26" height="18" rx="6" />
    <rect x="132" y="247" width="26" height="18" rx="6" />
    <rect x="132" y="292" width="26" height="18" rx="6" />
    <!-- Right Pins -->
    <rect x="354" y="202" width="26" height="18" rx="6" />
    <rect x="354" y="247" width="26" height="18" rx="6" />
    <rect x="354" y="292" width="26" height="18" rx="6" />
  </g>

  <!-- Central Gateway Hub (Microchip Processor) -->
  <rect x="154" y="164" width="204" height="184" rx="36" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="164" y="174" width="184" height="164" rx="28" fill="#0b1120" />

  <!-- Center Typography: "IoT" -->
  <text x="256" y="282" 
        font-family="system-ui, -apple-system, 'Outfit', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="86" 
        font-weight="900" 
        letter-spacing="2"
        fill="#ffffff" 
        text-anchor="middle">IoT</text>

  <!-- Wireless Gateway Waves radiating from Hub top right -->
  <g stroke="url(#signalGrad)" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 334 138 A 120 120 0 0 1 408 212" opacity="0.95" />
    <path d="M 366 106 A 165 165 0 0 1 446 186" opacity="0.75" />
  </g>

  <!-- Signal Pulse Dot -->
  <circle cx="304" cy="168" r="8" fill="#38bdf8" />
</svg>
